[project]
name = "timss-math"
version = "0.1.0"
description = "Item-level datasets of the released TIMSS mathematics items and LLM predictions of their IRT parameters"
readme = "README.md"
authors = [
    { name = "Ze Wang", email = "zewang@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "ipython>=9.17.1",
    "irw>=0.3.1",
    "openai>=3.20.0",
    "openai-agents>=0.22.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "qdrant-client>=1.14.2",
    "pyreadstat>=1.3.6",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
    "matplotlib>=3.11.2",
    "fastembed>=0.8.1",
    "ipywidgets>=8.1.9",
    "httpx2>=2.13.1",
    "scipy>=1.18.1",
    "filelock>=4.0.10",
]

[project.scripts]
timss-predict-loo = "timss_math.item_parameter_prediction.evaluation:main"
timss-plot-errors = "timss_math.item_parameter_prediction.plots:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[tool.ruff.lint.flake8-bugbear]
# Frozen dataclasses of immutable fields, so one default instance can be shared (B008).
extend-immutable-calls = [
    "timss_math.item_parameter_prediction.embeddings.EmbeddingSettings",
    "timss_math.item_parameter_prediction.index.IndexSettings",
    "timss_math.item_parameter_prediction.predictor.LLMSettings",
]
