[project]
name = "timss-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ze Wang", email = "zewang@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncio>=4.0.0",
    "ipykernel>=7.3.0",
    "ipython>=9.17.1",
    "irw>=0.3.1",
    "openai>=3.20.0",
    "openai-agents>=0.22.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "qdrant-client>=1.14.2",
    "pyreadstat>=1.3.6",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
]

[project.scripts]
timss-1 = "timss_1:main"
timss2011-convert = "timss_1.timss2011:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
